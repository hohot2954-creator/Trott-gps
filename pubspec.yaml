name: Build APK Zero Erreur

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          cache: true

      - name: Build APK Final
        run: |
          flutter --disable-analytics

          if [ ! -d "android" ]; then
            flutter create . --org com.example.trottgps --project-name trott_gps
          fi

          # Écriture propre du pubspec.yaml sans espaces parasites
          echo "name: trott_gps" > pubspec.yaml
          echo "description: GPS Pro pour micro-mobilite" >> pubspec.yaml
          echo "publish_to: 'none'" >> pubspec.yaml
          echo "version: 1.0.0+1" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "environment:" >> pubspec.yaml
          echo "  sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "dependencies:" >> pubspec.yaml
          echo "  flutter:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          echo "  flutter_map: ^6.1.0" >> pubspec.yaml
          echo "  latlong2: ^0.9.0" >> pubspec.yaml
          echo "  geolocator: ^10.1.0" >> pubspec.yaml
          echo "  flutter_tts: ^3.8.3" >> pubspec.yaml
          echo "  http: ^1.2.0" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "dev_dependencies:" >> pubspec.yaml
          echo "  flutter_test:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          echo "  flutter_lints: ^3.0.0" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "flutter:" >> pubspec.yaml
          echo "  uses-material-design: true" >> pubspec.yaml

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
