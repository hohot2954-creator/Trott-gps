name: Build APK Definitif

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          cache: true

      - name: Build APK Final
        run: |
          flutter --disable-analytics
          flutter clean
          flutter pub get

          # Forçage propre du minSdk à 21 dans build.gradle s'il existe
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          fi

          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
