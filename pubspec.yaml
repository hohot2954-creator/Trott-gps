name: Build APK Sur-Bousté 80000%

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          cache: true

      - name: Build APK Ultra Propre
        run: |
          flutter --disable-analytics

          if [ ! -d "android" ]; then
            flutter create . --org com.example.trottgps --project-name trott_gps
          fi

          # Injection directe et parfaite du pubspec.yaml sans aucune erreur de contrainte
          cat << 'EOF' > pubspec.yaml
          name: trott_gps
          description: GPS Pro pour micro-mobilite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_map: ^6.1.0
            latlong2: ^0.9.0
            geolocator: ^10.1.0
            flutter_tts: ^3.8.3
            http: ^1.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Forcer le minSdk à 21 pour valider tous les plugins natifs
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
