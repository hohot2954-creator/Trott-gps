name: trott_gps
description: Application GPS Pro Micro-Mobilité
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  flutter_tts: ^3.8.5

flutter:
  uses-material-design: true
  name: Build APK Neuf

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Retirer le dépôt
        uses: actions/checkout@v3

      - name: Configurer Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Generation et Build Direct
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
