          # ON ÉCRASE LE PUBSPEC.YAML FRAÎCHEMENT CRÉÉ AVEC NOTRE VERSION COMPLÈTE ET SA CONTRAINTE SDK VALIDE
          rm -f pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: trott_gps
          description: GPS Pro pour micro-mobilite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_map: ^6.1.0
            latlong2: ^0.9.0
            geolocator: ^10.1.0
            flutter_tts: ^3.8.3
            http: ^1.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # ON FORCERA ENSUITE LE MINSDK À 21 DANS LE BUILD.GRADLE GÉNÉRÉ
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
