name: Build APK GPS Route Directe

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          cache: true

      - name: Build APK Final et Propre
        run: |
          flutter --disable-analytics

          # ON NETTOIE TOUT LE PROJET À LA RACINE SAUF LE DOSSIER .git POUR ÉVITER LES CONFLITS DE FICHIERS DE CONFIG
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # ON CRÉE UN PROJET FLUTTER NEUF PROPREMENT DE ZÉRO
          flutter create . --org com.example.trottgps --project-name trott_gps

          # ON ÉCRASE LE PUBSPEC.YAML FRAÎCHEMENT CRÉÉ AVEC NOTRE VERSION COMPLÈTE ET SA CONTRAINTE SDK VALIDE
          rm -f pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: trott_gps
          description: GPS Pro pour micro-mobilite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_map: ^6.1.0
            latlong2: ^0.9.0
            geolocator: ^10.1.0
            flutter_tts: ^3.8.3
            http: ^1.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # ON FORCERA ENSUITE LE MINSDK À 21 DANS LE BUILD.GRADLE GÉNÉRÉ
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
