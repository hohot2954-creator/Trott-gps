name: Build APK Neuf

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Retirer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Recréer et Compiler Proprement
        run: |
          # Désactiver l'analytique Flutter pour éviter les blocages de prompts
          flutter --disable-analytics

          # Sauvegarder le code actuel
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/
          cp pubspec.yaml temp_backup/

          # Supprimer les anciens fichiers pour repartir sur du neuf
          rm -rf android ios lib web windows linux macos pubspec.yaml

          # Recréer un projet complet et propre
          flutter create . --org com.example.trottgps --project-name trott_gps

          # Restaurer le main.dart et le pubspec.yaml
          cp temp_backup/main.dart lib/
          cp temp_backup/pubspec.yaml ./

          # Lancer la compilation de l'APK de debug
          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
