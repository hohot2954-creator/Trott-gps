name: Build APK Parfait

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Injection et Build Infaillible
        run: |
          flutter --disable-analytics

          # Si le dossier android n'existe pas dans ton dépôt GitHub, on le crée proprement aux normes
          if [ ! -d "android" ]; then
            echo "Création de la structure Android manquante..."
            flutter create . --org com.example.trottgps --project-name trott_gps
          fi

          # Forcer le minSdk à 21 pour valider les plugins récents
          echo "minSdkVersion = 21" >> android/local.properties || true

          # Compilation directe de l'APK
          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
