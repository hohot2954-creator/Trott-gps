name: Build APK Neuf

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Retirer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Recréer et Compiler Proprement
        run: |
          # On sauvegarde le main.dart et le pubspec.yaml actuels
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/
          cp pubspec.yaml temp_backup/

          # On recrée un projet Flutter propre par-dessus
          flutter create . --org com.example.trottgps --project-name trott_gps --force

          # On remet nos fichiers sauvegardés à leur place
          mkdir -p lib
          cp temp_backup/main.dart lib/
          cp temp_backup/pubspec.yaml ./

          # Compilation directe de l'APK
          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
