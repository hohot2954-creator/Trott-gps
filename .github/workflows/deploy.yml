name: Build APK Definitif

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Build APK Sans Soucis
        run: |
          flutter --disable-analytics

          # Si le dossier android n'existe pas, on le génère
          if [ ! -d "android" ]; then
            echo "Génération de la structure Android..."
            flutter create . --org com.example.trottgps --project-name trott_gps
          fi

          # Forcer le minSdk à 21
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          # Mettre à jour la version de Kotlin dans settings.gradle (utilisé par Flutter moderne)
          if [ -f "android/settings.gradle" ]; then
            echo "Mise à jour de Kotlin dans android/settings.gradle"
            sed -i 's/version "1.8.22" apply false/version "1.9.0" apply false/g' android/settings.gradle || true
            sed -i 's/kotlin-version = .*/kotlin-version = "1.9.0"/g' android/settings.gradle || true
          fi

          flutter pub get
          flutter build apk --debug

      - name: Stocker l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
